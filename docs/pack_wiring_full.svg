<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="790" viewBox="0 0 1180 790" font-family="Arial, Helvetica, sans-serif">
<title>Everything on the 18650 pack - wiring (2026-10-16)</title>
<desc>2S pack through XT30 and rocker to the switched VBAT rail, which feeds the TB6612 motor driver, the LM2596 5.0 V buck (LED strips, encoder) and the pack-sense divider. Uno pins are net labels. Every ground symbol is its own wire to the star point, the TB6612 GND pad. The Uno and the servo are NOT powered by the pack.</desc>
<rect x="0" y="0" width="1180" height="790" fill="#FFFFFF"/>
<text x="40" y="34" font-size="18" font-weight="bold" fill="#2C2C2A">Everything on the 18650 pack - wiring (2026-10-16)</text>
<text x="40" y="56" font-size="12" fill="#5F5E5A">Labels like D11 are Uno pins (net labels). Every ground symbol = its OWN wire to the star point = the TB6612 GND pad.</text>
<text x="40" y="74" font-size="12" fill="#5F5E5A">NOT on the pack: the Uno (powered by the Pi's USB, record JF) and the servo (Uno 5V header, record JR). Source: docs/WIRING_PROTOSHIELD.md section 2.</text>

<!-- pack -->
<rect x="40" y="100" width="200" height="170" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="140" y="124" font-size="14" font-weight="bold" text-anchor="middle" fill="#085041">2S PACK</text>
<text x="52" y="148" font-size="12" fill="#085041">2x Samsung 25R, DIANN holder</text>
<text x="52" y="168" font-size="12" fill="#085041">3 A fuse in CELL+</text>
<text x="52" y="188" font-size="12" fill="#085041">BMS B08HLQQCQJ (on holder)</text>
<text x="52" y="208" font-size="12" fill="#085041">USB-C charger on P+ / P-</text>
<text x="52" y="228" font-size="12" fill="#0F6E56">detail: docs/bms_wiring.svg</text>
<text x="232" y="134" font-size="12" text-anchor="end" fill="#A32D2D">P+</text>
<text x="232" y="244" font-size="12" text-anchor="end" fill="#444441">P-</text>

<!-- XT30 -->
<rect x="290" y="105" width="70" height="150" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="325" y="176" font-size="14" font-weight="bold" text-anchor="middle" fill="#444441">XT30</text>
<text x="325" y="194" font-size="11" text-anchor="middle" fill="#5F5E5A">pack | car</text>
<line x1="240" y1="130" x2="290" y2="130" stroke="#E24B4A" stroke-width="2.5"/>
<line x1="240" y1="240" x2="290" y2="240" stroke="#444441" stroke-width="2.5"/>

<!-- rocker -->
<rect x="400" y="105" width="90" height="50" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="445" y="126" font-size="13" font-weight="bold" text-anchor="middle" fill="#444441">Rocker</text>
<text x="445" y="144" font-size="11" text-anchor="middle" fill="#5F5E5A">ON / OFF</text>
<line x1="360" y1="130" x2="400" y2="130" stroke="#E24B4A" stroke-width="2.5"/>

<!-- P- to star -->
<line x1="360" y1="240" x2="400" y2="240" stroke="#444441" stroke-width="2.5"/>
<line x1="400" y1="240" x2="400" y2="258" stroke="#444441" stroke-width="2.5"/>
<line x1="390" y1="258" x2="410" y2="258" stroke="#444441" stroke-width="2"/>
<line x1="394" y1="262" x2="406" y2="262" stroke="#444441" stroke-width="2"/>
<line x1="398" y1="266" x2="402" y2="266" stroke="#444441" stroke-width="2"/>
<text x="414" y="266" font-size="11" fill="#444441">star (P-, never B-)</text>

<!-- VBAT bus -->
<line x1="490" y1="130" x2="540" y2="130" stroke="#E24B4A" stroke-width="2.5"/>
<line x1="540" y1="130" x2="540" y2="680" stroke="#E24B4A" stroke-width="2.5"/>
<text x="548" y="122" font-size="12" font-weight="bold" fill="#A32D2D">VBAT - switched, 6.4-8.4 V</text>
<circle cx="540" cy="210" r="3.5" fill="#E24B4A"/>
<circle cx="540" cy="520" r="3.5" fill="#E24B4A"/>
<line x1="540" y1="210" x2="600" y2="210" stroke="#E24B4A" stroke-width="2.5"/>
<line x1="540" y1="520" x2="600" y2="520" stroke="#E24B4A" stroke-width="2.5"/>
<line x1="540" y1="680" x2="600" y2="680" stroke="#E24B4A" stroke-width="2.5"/>

<!-- TB6612 -->
<rect x="600" y="160" width="230" height="270" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="715" y="182" font-size="14" font-weight="bold" text-anchor="middle" fill="#3C3489">TB6612FNG motor driver</text>
<text x="608" y="214" font-size="12" font-weight="bold" fill="#3C3489">VM</text>
<text x="608" y="240" font-size="12" fill="#3C3489">VCC &lt;- Uno 5V (logic)</text>
<text x="608" y="262" font-size="12" fill="#3C3489">PWMA+PWMB &lt;- D11</text>
<text x="608" y="284" font-size="12" fill="#3C3489">AIN1+BIN1 &lt;- D8</text>
<text x="608" y="306" font-size="12" fill="#3C3489">AIN2+BIN2 &lt;- D12</text>
<text x="608" y="328" font-size="12" fill="#3C3489">STBY &lt;- D10</text>
<text x="608" y="358" font-size="12" fill="#534AB7">470-1000 uF VM-GND, at the board</text>
<text x="608" y="404" font-size="12" font-weight="bold" fill="#3C3489">GND = STAR POINT</text>
<text x="822" y="254" font-size="12" text-anchor="end" fill="#3C3489">AO1+BO1</text>
<text x="822" y="314" font-size="12" text-anchor="end" fill="#3C3489">AO2+BO2</text>
<line x1="715" y1="430" x2="715" y2="448" stroke="#444441" stroke-width="2.5"/>
<line x1="705" y1="448" x2="725" y2="448" stroke="#444441" stroke-width="2"/>
<line x1="709" y1="452" x2="721" y2="452" stroke="#444441" stroke-width="2"/>
<line x1="713" y1="456" x2="717" y2="456" stroke="#444441" stroke-width="2"/>
<text x="729" y="456" font-size="11" fill="#444441">star</text>

<!-- motor -->
<line x1="830" y1="250" x2="900" y2="250" stroke="#6E6B9E" stroke-width="2.5"/>
<line x1="830" y1="310" x2="900" y2="310" stroke="#6E6B9E" stroke-width="2.5"/>
<rect x="900" y="160" width="250" height="260" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<text x="1025" y="182" font-size="14" font-weight="bold" text-anchor="middle" fill="#712B13">N20 motor + encoder</text>
<text x="1025" y="200" font-size="11" text-anchor="middle" fill="#993C1D">Pololu #5159, 6-wire JST cable</text>
<text x="910" y="254" font-size="12" fill="#712B13">M1 (red)</text>
<text x="910" y="284" font-size="11" fill="#993C1D">0.1 uF across M1-M2, at the motor</text>
<text x="910" y="314" font-size="12" fill="#712B13">M2 (black)</text>
<text x="910" y="344" font-size="12" fill="#712B13">enc Vcc (blue) &lt;- +5V2</text>
<text x="910" y="364" font-size="12" fill="#712B13">enc GND (green) -&gt; star, own wire</text>
<text x="910" y="384" font-size="12" fill="#712B13">A (yellow) -&gt; D2</text>
<text x="910" y="404" font-size="12" fill="#712B13">B (white) -&gt; D3</text>

<!-- LM2596 -->
<rect x="600" y="490" width="230" height="90" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text x="715" y="512" font-size="14" font-weight="bold" text-anchor="middle" fill="#633806">LM2596 buck</text>
<text x="608" y="524" font-size="12" font-weight="bold" fill="#633806">VIN+</text>
<text x="715" y="542" font-size="12" text-anchor="middle" fill="#854F0B">set 4.99 V unloaded (JE)</text>
<text x="715" y="562" font-size="11" text-anchor="middle" fill="#854F0B">VIN- / VOUT- -&gt; star, one leg</text>
<text x="822" y="524" font-size="12" font-weight="bold" text-anchor="end" fill="#633806">VOUT+</text>
<line x1="715" y1="580" x2="715" y2="598" stroke="#444441" stroke-width="2.5"/>
<line x1="705" y1="598" x2="725" y2="598" stroke="#444441" stroke-width="2"/>
<line x1="709" y1="602" x2="721" y2="602" stroke="#444441" stroke-width="2"/>
<line x1="713" y1="606" x2="717" y2="606" stroke="#444441" stroke-width="2"/>
<text x="729" y="606" font-size="11" fill="#444441">star</text>

<!-- +5V2 to strips -->
<line x1="830" y1="520" x2="900" y2="520" stroke="#BA7517" stroke-width="2.5"/>
<text x="865" y="512" font-size="12" font-weight="bold" text-anchor="middle" fill="#854F0B">+5V2</text>
<rect x="900" y="470" width="250" height="150" rx="8" fill="#FBEAF0" stroke="#993556"/>
<text x="1025" y="492" font-size="14" font-weight="bold" text-anchor="middle" fill="#72243E">WS2812B strips, 2 segments</text>
<text x="910" y="524" font-size="12" fill="#72243E">+5V2 to each segment</text>
<text x="910" y="546" font-size="12" fill="#72243E">DIN left &lt;- D4 via 400 ohm (2x200)</text>
<text x="910" y="566" font-size="12" fill="#72243E">DIN right &lt;- D7 via 400 ohm (2x200)</text>
<text x="910" y="586" font-size="12" fill="#72243E">470 uF across +5V2 / GND at the feed</text>
<text x="910" y="606" font-size="12" fill="#72243E">each segment GND -&gt; star, own wire</text>

<!-- divider -->
<rect x="600" y="640" width="230" height="90" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="715" y="662" font-size="14" font-weight="bold" text-anchor="middle" fill="#444441">Pack-sense divider</text>
<text x="608" y="684" font-size="12" fill="#444441">top 100 kohm (from VBAT)</text>
<text x="608" y="704" font-size="12" fill="#444441">junction -&gt; Uno A0 (AREF open)</text>
<text x="608" y="722" font-size="12" fill="#444441">bottom 12 kohm = 10k + 2k -&gt; star</text>
<line x1="715" y1="730" x2="715" y2="748" stroke="#444441" stroke-width="2.5"/>
<line x1="705" y1="748" x2="725" y2="748" stroke="#444441" stroke-width="2"/>
<line x1="709" y1="752" x2="721" y2="752" stroke="#444441" stroke-width="2"/>
<line x1="713" y1="756" x2="717" y2="756" stroke="#444441" stroke-width="2"/>
<text x="729" y="756" font-size="11" fill="#444441">star</text>

<!-- Uno reference -->
<rect x="40" y="320" width="440" height="300" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="260" y="344" font-size="14" font-weight="bold" text-anchor="middle" fill="#0C447C">Uno pins used (Uno powered by the Pi's USB)</text>
<text x="52" y="372" font-size="12" fill="#0C447C">D11 -&gt; TB6612 PWMA+PWMB (speed)</text>
<text x="52" y="394" font-size="12" fill="#0C447C">D8 / D12 -&gt; AIN1+BIN1 / AIN2+BIN2 (direction)</text>
<text x="52" y="416" font-size="12" fill="#0C447C">D10 -&gt; STBY (driver enable)</text>
<text x="52" y="438" font-size="12" fill="#0C447C">D2 / D3 &lt;- encoder A / B</text>
<text x="52" y="460" font-size="12" fill="#0C447C">D4 / D7 -&gt; strip DIN left / right (via 400 ohm)</text>
<text x="52" y="482" font-size="12" fill="#0C447C">A0 &lt;- divider junction</text>
<text x="52" y="504" font-size="12" fill="#0C447C">5V -&gt; TB6612 VCC (logic) and servo V+ (JR)</text>
<text x="52" y="526" font-size="12" fill="#0C447C">D9 -&gt; servo signal (servo is NOT on the pack)</text>
<text x="52" y="548" font-size="12" fill="#0C447C">GND -&gt; star, own wire</text>
<text x="52" y="578" font-size="11" fill="#185FA5">+5V2 must NEVER touch the Uno 5V pin.</text>
<text x="52" y="596" font-size="11" fill="#185FA5">Encoder Vcc from +5V2 only, never VBAT (its outputs feed D2 / D3).</text>

<!-- legend -->
<line x1="40" y1="660" x2="70" y2="660" stroke="#E24B4A" stroke-width="2.5"/>
<text x="78" y="664" font-size="12" fill="#2C2C2A">pack + / VBAT</text>
<line x1="40" y1="684" x2="70" y2="684" stroke="#444441" stroke-width="2.5"/>
<text x="78" y="688" font-size="12" fill="#2C2C2A">ground (each symbol = own wire to the star)</text>
<line x1="40" y1="708" x2="70" y2="708" stroke="#BA7517" stroke-width="2.5"/>
<text x="78" y="712" font-size="12" fill="#2C2C2A">+5V2 (LM2596 output, 5.0 V)</text>
<line x1="40" y1="732" x2="70" y2="732" stroke="#6E6B9E" stroke-width="2.5"/>
<text x="78" y="736" font-size="12" fill="#2C2C2A">motor output (driver -&gt; motor)</text>
<text x="40" y="766" font-size="11" fill="#5F5E5A">Built so far: pack, charger, XT30 (pack half), LM2596 set. Not yet built: 2b (XT30 car half, rocker), divider, TB6612, motor, strips.</text>
</svg>
